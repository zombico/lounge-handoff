<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lounge</title>
<meta name="description" content="One room from a twelve-line mojulo recipe, lit and walkable in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zombico.github.io/lounge-handoff/">
<meta property="og:site_name" content="mojulo">
<meta property="og:title" content="The Lounge — 20×24 ft from a 12-line recipe">
<meta property="og:description" content="Walk it in the browser. Same recipe went to Blender, Godot, Unreal.">
<meta property="og:image" content="https://zombico.github.io/lounge-handoff/renders/social-card.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A sunlit 20 by 24 foot living room: couch, two armchairs, coffee table, windows on three walls.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2316140f%27/%3E%3Crect x=%277%27 y=%2714%27 width=%2718%27 height=%279%27 rx=%272%27 fill=%27%23d9905a%27/%3E%3Ccircle cx=%2716%27 cy=%278%27 r=%272.5%27 fill=%27%23fff1c8%27/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font: 14px/1.4 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; color: #e9e4d8; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #brand { position: absolute; left: 18px; bottom: 16px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #brand b { font-weight: 600; font-size: 15px; letter-spacing: .2px; }
  #brand span { display: block; font-size: 12px; opacity: .72; margin-top: 2px; }
  #ctl { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #ctl button { appearance: none; border: 1px solid rgba(255,255,255,.22); background: rgba(12,14,20,.55); color: #e9e4d8; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; backdrop-filter: blur(6px); }
  #ctl button:hover { border-color: rgba(255,255,255,.5); }
  #ctl button.on { background: rgba(233,228,216,.92); color: #16140f; border-color: transparent; }
  #ctl .sep { width: 1px; background: rgba(255,255,255,.18); margin: 4px 4px; }
  #log { position: absolute; right: 18px; bottom: 16px; color: #e9e4d8; opacity: .72; text-decoration: none; font-size: 12.5px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #log:hover { opacity: 1; }
  #hint { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); font-size: 12.5px; opacity: 0; transition: opacity .4s; text-shadow: 0 1px 8px rgba(0,0,0,.7); white-space: nowrap; }
  #hint.show { opacity: .8; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0d12; transition: opacity .6s; font-size: 13px; letter-spacing: .3px; opacity: .85; }
  #loading.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { #brand span { display: none; } #hint { bottom: 60px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="ctl">
    <button data-mode="tour" class="on">tour</button>
    <button data-mode="walk">walk</button>
    <span class="sep"></span>
    <button data-tod="day" class="on">day</button>
    <button data-tod="dusk">dusk</button>
    <button data-tod="night">night</button>
  </div>
  <div id="brand"><b>The Lounge</b><span>a 20 × 24 ft living room from a twelve-line mojulo recipe, lit in your browser</span></div>
  <a id="log" href="report/">how it was made →</a>
  <div id="hint"></div>
  <div id="loading">loading the room…</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// The room is the lit glTF mojulo exported for the engines: y-up, metres, nine KHR spots in
// candela, an emissive lens per can, the oak floor as an embedded texture, two unlit stickers.
const GLB = 'packs/lounge-lit.glb';
const EYE = 1.615;                      // the score's eye, an adult's
const SPAWN = new THREE.Vector3(3.66, EYE, -4.27);   // the score's spawn, mapped z-up → y-up
const LOOK = new THREE.Vector3(3.66, 1.45, -0.9);    // the media wall
const WALK_START = new THREE.Vector3(3.66, EYE, -7.35); // just inside the door; the score's own spawn lands on the coffee table

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 200);
camera.position.copy(SPAWN);
camera.lookAt(LOOK);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// --- the light rig: a sun through the panes, a sky, and the pack's own spots ----------------
const sun = new THREE.DirectionalLight(0xfff1dc, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9; sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.target.position.set(3.66, 0, -4.27);
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbcd2ee, 0x6b5a48, 0.8);
scene.add(hemi);
const spots = [];   // { light, base } — base is the glTF's candela

function sunAt(azDeg, elDeg) {
  const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
  sun.position.set(3.66 + Math.cos(el) * Math.sin(az) * 30, Math.sin(el) * 30, -4.27 + Math.cos(el) * Math.cos(az) * 30);
}

const PRESETS = {
  //          sky background   sun (lux-ish)          sky / ground hemisphere        spots × candela  env    exposure
  day:   { bg: 0x9fb8d6, sun: { i: 4.6, c: 0xfff3e0, az: 236, el: 31 }, hemi: { i: 1.15, s: 0xd8e2ee, g: 0x8a7560 }, spot: 0.05, env: 0.45, exp: 1.0 },
  dusk:  { bg: 0xd08a5c, sun: { i: 1.4, c: 0xffb070, az: 250, el: 9 },  hemi: { i: 0.35, s: 0xe0a680, g: 0x3d3128 }, spot: 0.22, env: 0.16, exp: 0.95 },
  night: { bg: 0x0a0f1c, sun: { i: 0.0, c: 0x8090c0, az: 250, el: -10 }, hemi: { i: 0.06, s: 0x3a4a6a, g: 0x0e0c0a }, spot: 0.15, env: 0.05, exp: 0.85 },
};
let preset = 'day';
function applyPreset(name) {
  const p = PRESETS[name]; if (!p) return;
  preset = name;
  scene.background = new THREE.Color(p.bg);
  sun.intensity = p.sun.i; sun.color.set(p.sun.c); sunAt(p.sun.az, p.sun.el); sun.visible = p.sun.i > 0;
  hemi.intensity = p.hemi.i; hemi.color.set(p.hemi.s); hemi.groundColor.set(p.hemi.g);
  for (const s of spots) s.light.intensity = s.base * p.spot;
  scene.environmentIntensity = p.env;
  renderer.toneMappingExposure = p.exp;
  for (const b of document.querySelectorAll('#ctl [data-tod]')) b.classList.toggle('on', b.dataset.tod === name);
}

// --- the room ---------------------------------------------------------------------------------
const colliders = [];          // world AABBs of the furniture
let floorBox = null;           // where the feet may go
const loader = new GLTFLoader();
loader.load(GLB, (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (o.isSpotLight) {
      spots.push({ light: o, base: o.intensity });
      o.castShadow = true;
      o.shadow.mapSize.set(512, 512);
      o.shadow.bias = -0.0005; o.shadow.normalBias = 0.02;
      o.shadow.camera.near = 0.2; o.shadow.camera.far = 12;
      o.decay = 2; o.distance = 0;
    }
    if (!o.isMesh) return;
    const name = (o.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');   // 'floor:skin:wood-oak' → 'floorskinwoodoak'
    const m = o.material;
    if (m && m.transparent) {                       // the stickers: contact shadows, panes
      o.castShadow = false; o.receiveShadow = false; o.renderOrder = 2;
      m.depthWrite = false;
      if (name.startsWith('water')) { m.opacity = Math.min(m.opacity, 0.35); m.side = THREE.DoubleSide; }
      if (name.startsWith('shadows')) m.opacity = Math.min(m.opacity, 0.8);
      return;
    }
    if (name.startsWith('floorskinwood')) {
      // the oak grain, one texel layer over the plank coat: the web tier's texel × baked light
      const tex = m.map;
      o.material = new THREE.MeshBasicMaterial({ map: tex, blending: THREE.MultiplyBlending, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
      o.renderOrder = 1; o.castShadow = false; o.receiveShadow = false;
      return;
    }
    o.castShadow = !name.startsWith('shellceiling') || name.includes('potlight');
    o.receiveShadow = true;
    if (m && m.isMeshStandardMaterial) { m.roughness = Math.min(1, Math.max(0.55, m.roughness)); m.envMapIntensity = 1; }
    if (name.startsWith('asset') && !name.includes('rug')) {
      const box = new THREE.Box3().setFromObject(o);
      if (box.max.y - box.min.y > 0.25) colliders.push(box.expandByScalar(0.04));
    }
    if (name === 'floorskin') floorBox = new THREE.Box3().setFromObject(o);
  });
  if (!floorBox) floorBox = new THREE.Box3(new THREE.Vector3(0.7, 0, -7.9), new THREE.Vector3(6.6, 0, -0.7));
  applyPreset(preset);
  document.getElementById('loading').classList.add('gone');
  ready = true;
  hint(isTouch ? 'drag to look · pinch to zoom' : 'click to walk · WASD move · mouse look · Esc to release', 5000);
}, undefined, (e) => { document.getElementById('loading').textContent = 'could not load the room (' + (e && e.message ? e.message : e) + ')'; });

// --- walking ----------------------------------------------------------------------------------
const isTouch = matchMedia('(pointer: coarse)').matches;
const lock = new PointerLockControls(camera, canvas);
const orbit = new OrbitControls(camera, canvas);
orbit.target.copy(LOOK); orbit.enableDamping = true; orbit.enabled = false;
orbit.minDistance = 0.3; orbit.maxDistance = 9; orbit.maxPolarAngle = Math.PI * 0.55;
const keys = new Set();
window.addEventListener('keydown', (e) => { keys.add(e.code); if (mode === 'tour' && !e.metaKey && !e.ctrlKey && !isTouch && ready) { if (lock.isLocked) setMode('walk'); } });
window.addEventListener('keyup', (e) => keys.delete(e.code));
const vel = new THREE.Vector3();
const RADIUS = 0.28;

function blocked(p) {
  if (floorBox && (p.x < floorBox.min.x + RADIUS || p.x > floorBox.max.x - RADIUS || p.z < floorBox.min.z + RADIUS || p.z > floorBox.max.z - RADIUS)) return true;
  for (const b of colliders) if (p.x > b.min.x - RADIUS && p.x < b.max.x + RADIUS && p.z > b.min.z - RADIUS && p.z < b.max.z + RADIUS) return true;
  return false;
}
function walk(dt) {
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
  const dir = new THREE.Vector3();
  if (keys.has('KeyW') || keys.has('ArrowUp')) dir.add(fwd);
  if (keys.has('KeyS') || keys.has('ArrowDown')) dir.sub(fwd);
  if (keys.has('KeyD') || keys.has('ArrowRight')) dir.add(right);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) dir.sub(right);
  const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.2 : 1.9;
  if (dir.lengthSq() > 0) dir.normalize().multiplyScalar(speed);
  vel.lerp(dir, 1 - Math.exp(-dt * 12));
  const p = camera.position;
  const here = blocked(p);                        // inside something already: never trap, let any step out
  const nx = p.clone().setX(p.x + vel.x * dt); if (here || !blocked(nx)) p.x = nx.x; else vel.x = 0;
  const nz = p.clone().setZ(p.z + vel.z * dt); if (here || !blocked(nz)) p.z = nz.z; else vel.z = 0;
  p.y = EYE;
}

// --- the tour: the same moves the engine videos make, on a loop --------------------------------
const P = (x, y, z) => new THREE.Vector3(x, y, z);   // mojulo metres, y-up
const TOUR = [
  { from: P(3.66, 1.55, -7.25), to: P(3.66, 1.35, -4.9), look: P(3.66, 1.0, -0.9), lookTo: P(3.66, 1.0, -0.9), secs: 7 },        // in from the door
  { orbit: { c: P(3.66, 0.9, -3.4), r: 2.1, h: 0.75, from: 90, to: 450 }, secs: 16 },                                            // around the seating group
  { from: P(1.2, 1.5, -1.6), to: P(5.6, 1.5, -1.4), look: P(3.66, 0.7, -5.0), lookTo: P(3.66, 0.7, -5.0), secs: 9 },            // along the media wall
  { from: P(3.66, 1.35, -4.9), to: P(3.66, 1.55, -7.25), look: P(3.66, 1.0, -0.9), lookTo: P(3.66, 1.6, -0.9), secs: 7 },       // back to the door
];
let tourT = 0;
const ease = (t) => t * t * (3 - 2 * t);
function tour(dt) {
  tourT += dt;
  const total = TOUR.reduce((s, k) => s + k.secs, 0);
  let t = tourT % total, i = 0;
  while (t > TOUR[i].secs) { t -= TOUR[i].secs; i++; }
  const k = TOUR[i], u = t / k.secs;
  if (k.orbit) {
    const a = THREE.MathUtils.degToRad(k.orbit.from + (k.orbit.to - k.orbit.from) * u);
    camera.position.set(k.orbit.c.x + Math.cos(a) * k.orbit.r, k.orbit.c.y + k.orbit.h, k.orbit.c.z + Math.sin(a) * k.orbit.r);
    camera.lookAt(k.orbit.c);
  } else {
    const e = ease(u);
    camera.position.lerpVectors(k.from, k.to, e);
    camera.lookAt(new THREE.Vector3().lerpVectors(k.look, k.lookTo, e));
  }
}

// --- modes ------------------------------------------------------------------------------------
let mode = 'tour', ready = false, walked = false;   // walked: the walk keeps its place across tour / walk switches
function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('#ctl [data-mode]')) b.classList.toggle('on', b.dataset.mode === m);
  if (m === 'walk') {
    if (isTouch) { orbit.enabled = true; camera.position.set(3.66, 1.9, -6.2); orbit.target.copy(LOOK); orbit.update(); hint('drag to look · pinch to move closer', 3000); }
    else { orbit.enabled = false; if (!lock.isLocked) lock.lock(); if (!walked) { camera.position.copy(WALK_START); camera.lookAt(LOOK); walked = true; } vel.set(0, 0, 0); hint('WASD move · mouse look · Shift run · Esc to release', 3500); }
  } else {
    orbit.enabled = false; if (lock.isLocked) lock.unlock(); hint('', 0);
  }
}
lock.addEventListener('unlock', () => { if (mode === 'walk' && !isTouch) hint('click to walk again', 2500); });
canvas.addEventListener('click', () => { if (!ready) return; if (mode === 'walk' && !isTouch && !lock.isLocked) lock.lock(); else if (mode === 'tour') setMode('walk'); });
canvas.addEventListener('touchstart', () => { if (ready && mode === 'tour') setMode('walk'); }, { passive: true });
for (const b of document.querySelectorAll('#ctl [data-mode]')) b.addEventListener('click', () => setMode(b.dataset.mode));
for (const b of document.querySelectorAll('#ctl [data-tod]')) b.addEventListener('click', () => applyPreset(b.dataset.tod));
window.addEventListener('keydown', (e) => { if (e.code === 'Digit1') applyPreset('day'); if (e.code === 'Digit2') applyPreset('dusk'); if (e.code === 'Digit3') applyPreset('night'); if (e.code === 'KeyT') setMode(mode === 'tour' ? 'walk' : 'tour'); });

let hintTimer = 0;
function hint(text, ms) {
  const el = document.getElementById('hint'); clearTimeout(hintTimer);
  el.textContent = text; el.classList.toggle('show', !!text);
  if (ms) hintTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// --- frame ------------------------------------------------------------------------------------
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  resize();
  if (ready) {
    if (mode === 'tour') tour(dt);
    else if (isTouch) orbit.update();
    else if (lock.isLocked) walk(dt);
  }
  renderer.render(scene, camera);
});

// a small hook for the headless QA pass that took this page's screenshots
window.__lounge = {
  get ready() { return ready; },
  setPreset: applyPreset,
  setMode,
  snap(pos, look) { setMode('still'); camera.position.set(pos[0], pos[1], pos[2]); camera.lookAt(look[0], look[1], look[2]); },
  step(code, secs) { keys.add(code); for (let i = 0; i < secs * 60; i++) walk(1 / 60); keys.delete(code); return [camera.position.x, camera.position.y, camera.position.z]; },
  start() { camera.position.copy(WALK_START); camera.lookAt(LOOK); vel.set(0, 0, 0); return blocked(camera.position); },
  names() { const n = []; scene.traverse((o) => { if (o.isMesh) n.push(o.name); }); return n; },
  boxes() { return colliders.map((b) => [b.min.x, b.min.z, b.max.x, b.max.z].map((v) => +v.toFixed(2))); },
  floor() { return floorBox ? [floorBox.min.x, floorBox.min.z, floorBox.max.x, floorBox.max.z].map((v) => +v.toFixed(2)) : null; },
  tune(o) { if ('sun' in o) sun.intensity = o.sun; if ('hemi' in o) hemi.intensity = o.hemi; if ('env' in o) scene.environmentIntensity = o.env; if ('exp' in o) renderer.toneMappingExposure = o.exp; if ('az' in o) sunAt(o.az, o.el ?? 38); if ('spot' in o) for (const s of spots) s.light.intensity = s.base * o.spot; },
};
</script>
</body>
</html>
